# Crowdin config — see README.md "Translation management (Crowdin)" for
# the one-time account setup and the day-to-day upload/download commands.
#
# English (locales/en.json) is the source of truth: it's what translators
# in the Crowdin dashboard work from. The other five files
# (locales/ko.json, ja.json, uk.json, es.json, fr.json) are downloaded
# translations — Crowdin overwrites them on `crowdin download`, so don't
# hand-edit them once this is wired up; edit locales/en.json (or add new
# keys there) and let Crowdin propagate the rest.

files:
  - source: /locales/en.json
    translation: /locales/%two_letters_code%.json
    languages_mapping:
      two_letters_code:
        ko: ko
        ja: ja
        uk: uk
        es: es
        fr: fr
